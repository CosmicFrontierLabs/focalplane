  <rect x="1065" y="323" width="860" height="66" fill="#1e202e" stroke="#9ece6a" stroke-width="2"/>
  <text x="1085" y="365" font-size="23" fill="#9ece6a">in_cone_extended at TRUNCATION_SB_FRACTION</text>
  <rect x="80" y="401" width="860" height="66" fill="#1e202e" stroke="#f7768e" stroke-width="1.5"/>
  <text x="100" y="443" font-size="23" fill="#a9b1d6">sersic_splat.rs: local radius_at_fraction</text>
  <rect x="1065" y="401" width="860" height="66" fill="#1e202e" stroke="#9ece6a" stroke-width="2"/>
  <text x="1085" y="443" font-size="23" fill="#9ece6a">SersicProfile::radius_at_sb_fraction</text>
  <rect x="80" y="479" width="860" height="66" fill="#1e202e" stroke="#f7768e" stroke-width="1.5"/>
