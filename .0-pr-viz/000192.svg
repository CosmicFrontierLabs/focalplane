  <rect x="1065" y="245" width="860" height="66" fill="#1e202e" stroke="#9ece6a" stroke-width="2"/>
  <text x="1085" y="287" font-size="23" fill="#9ece6a">Dr3Catalog::augment_missing_in_cone</text>
