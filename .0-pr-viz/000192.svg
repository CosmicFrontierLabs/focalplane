  <text x="1085" y="1067" font-size="23" fill="#9ece6a">Time parse, add_seconds, transparent serde</text>
  <text x="55" y="1172" font-size="22" fill="#565f89">Stacked on #189. Epoch stays as a thin wrapper over Time; bright-limb PA now reported in [0, 2pi); utc_iso rounding is starfield#232.</text>
