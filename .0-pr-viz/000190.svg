  <text x="1040" y="995" font-size="21" fill="#9ece6a">R2 sequence: low discrepancy, log(n)/n</text>
  <g>
    <rect x="1330" y="710" width="615" height="250" rx="10" fill="#1e202e" stroke="#3d4666" stroke-width="2"/>
    <text x="1355" y="752" font-size="21" fill="#c0caf5">Quick decision guide</text>
    <text x="1355" y="792" font-size="21" fill="#a9b1d6">any n, nested subsets: R2</text>
    <text x="1355" y="827" font-size="21" fill="#a9b1d6">steep power law: Poisson-disk</text>
    <text x="1355" y="862" font-size="21" fill="#a9b1d6">n in {2, 4}: half-integer offsets</text>
    <text x="1355" y="897" font-size="21" fill="#a9b1d6">forgiving small n: jittered rotated grid</text>
    <text x="1355" y="932" font-size="21" fill="#a9b1d6">extent: +/-0.5 px or ~lambda/D</text>
  </g>

  <text x="55" y="1172" font-size="22" fill="#565f89">Docs and ignore rules only; no code changes (sims/quasi_random.rs is untouched). Data files are moved locally, never committed.</text>
</svg>
