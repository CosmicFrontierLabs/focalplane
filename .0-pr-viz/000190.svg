    <circle cx="105.3" cy="854.1" r="6" fill="#f7768e"/>
    <circle cx="212.5" cy="805.1" r="6" fill="#f7768e"/>
  <rect x="380" y="710" width="250" height="250" fill="#16161e" stroke="#3d4666" stroke-width="2"/>
    <circle cx="417.2" cy="747.2" r="6" fill="#e0af68"/>
    <circle cx="417.2" cy="805.8" r="6" fill="#e0af68"/>
    <circle cx="417.2" cy="864.2" r="6" fill="#e0af68"/>
