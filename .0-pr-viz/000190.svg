<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 1200"
     font-family="'Segoe UI', 'Noto Sans', 'DejaVu Sans', ui-sans-serif, system-ui, sans-serif">
  <rect x="0" y="0" width="2000" height="1200" fill="#16161e"/>

  <text x="55" y="52" font-size="24" letter-spacing="1" fill="#565f89">PR #190 · docs: add dither sampling note; keep local inputs out of git</text>

  <text x="55" y="100" font-size="34" fill="#e6e9f5">The dither-sampling note and 8 MB of flight telemetry sat loose in the repo root;</text>
  <text x="55" y="140" font-size="34" fill="#e6e9f5">now the note lives in docs/ and local inputs go in a gitignored local_data/.</text>
  <line x1="55" y1="165" x2="1945" y2="165" stroke="#3d4666" stroke-width="1"/>

  <text x="55" y="212" font-size="22" font-weight="700" letter-spacing="4" fill="#f7768e">BEFORE</text>
  <text x="1040" y="212" font-size="22" font-weight="700" letter-spacing="4" fill="#9ece6a">AFTER</text>
  <line x1="1000" y1="190" x2="1000" y2="1140" stroke="#3d4666" stroke-width="2" stroke-dasharray="8,8"/>

  <g>
    <rect x="55" y="240" width="905" height="400" rx="10" fill="#1e202e" stroke="#f7768e" stroke-width="2"/>
    <text x="80" y="282" font-size="23" fill="#a9b1d6">repo root, untracked (git status noise)</text>
    <text x="80" y="332" font-size="22" fill="#c0caf5" font-family="'DejaVu Sans Mono', monospace">dither_sampling.md</text>
    <text x="80" y="372" font-size="22" fill="#f7768e" font-family="'DejaVu Sans Mono', monospace">Run0001_20260224205907_2999.csv  7.8M</text>
    <text x="80" y="412" font-size="22" fill="#f7768e" font-family="'DejaVu Sans Mono', monospace">los_psd_at_2000rpm.csv</text>
    <text x="80" y="452" font-size="22" fill="#e0af68" font-family="'DejaVu Sans Mono', monospace">experiment_log_20260416_133825.csv</text>
    <text x="80" y="492" font-size="22" fill="#e0af68" font-family="'DejaVu Sans Mono', monospace">trajectory_los_2000rpm_{5,30,100}s.csv</text>
    <text x="80" y="552" font-size="21" fill="#a9b1d6">one git add away from committing ODY telemetry;</text>
    <text x="80" y="584" font-size="21" fill="#a9b1d6">script usage examples assume these sit in the root</text>
  </g>

  <g>
    <rect x="1040" y="240" width="905" height="400" rx="10" fill="#1e202e" stroke="#9ece6a" stroke-width="2"/>
    <text x="1065" y="282" font-size="23" fill="#a9b1d6">tracked changes</text>
    <text x="1065" y="332" font-size="22" fill="#9ece6a" font-family="'DejaVu Sans Mono', monospace">+ docs/dither-sampling.md</text>
    <text x="1065" y="372" font-size="22" fill="#9ece6a" font-family="'DejaVu Sans Mono', monospace">.gitignore: local_data/, experiment_log_*.csv</text>
    <text x="1065" y="412" font-size="22" fill="#c0caf5" font-family="'DejaVu Sans Mono', monospace">ody_to_trajectory_csv.py usage:</text>
    <text x="1065" y="447" font-size="22" fill="#c0caf5" font-family="'DejaVu Sans Mono', monospace">  --input local_data/Run0001_...csv</text>
    <text x="1065" y="487" font-size="22" fill="#c0caf5" font-family="'DejaVu Sans Mono', monospace">los_psd_to_trajectory_csv.py usage:</text>
    <text x="1065" y="522" font-size="22" fill="#c0caf5" font-family="'DejaVu Sans Mono', monospace">  --input local_data/los_psd_at_2000rpm.csv</text>
    <text x="1065" y="584" font-size="21" fill="#a9b1d6">regenerable trajectories and logs deleted locally</text>
  </g>

  <text x="55" y="690" font-size="23" fill="#a9b1d6">What the note argues (n = 16 dithers in one pixel):</text>
