  <text x="55" y="995" font-size="21" fill="#f7768e">uniform random: clumps, 1/sqrt(n)</text>
  <text x="380" y="995" font-size="21" fill="#e0af68">n x n lattice: harmonic</text>
  <text x="380" y="1025" font-size="21" fill="#e0af68">aliasing spikes</text>

  <text x="1040" y="690" font-size="23" fill="#a9b1d6">Recommended default (docs/dither-sampling.md):</text>
  <rect x="1040" y="710" width="250" height="250" fill="#16161e" stroke="#3d4666" stroke-width="2"/>
    <circle cx="1107.6" cy="734.3" r="6" fill="#9ece6a"/>
