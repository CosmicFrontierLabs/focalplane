name: Security Audit

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 12 * * 1'  # Weekly on Monday at noon UTC

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Install cargo-audit
      run: cargo install cargo-audit --locked

    # Advisories we have decided to carry are listed, with reasons, in
    # .cargo/audit.toml; other unmaintained transitive crates are tracked
    # in https://github.com/CosmicFrontierLabs/focalplane/issues/177.
    - name: Run security audit
      run: cargo audit
