name: Security Audit

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 12 * * 1'  # Weekly on Monday at noon UTC

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Install cargo-audit
      run: cargo install cargo-audit --locked

    # Ignored advisories are transitive-only unmaintained-crate warnings
    # blocked by pins in CosmicFrontierLabs/cfl-foundations (paste via
    # nalgebra 0.32, number_prefix via indicatif 0.17). Tracking:
    # https://github.com/CosmicFrontierLabs/cfl-foundations/issues/7
    # Other unmaintained transitive crates that only upstream can clear are
    # listed in https://github.com/CosmicFrontierLabs/focalplane/issues/177.
    - name: Run security audit
      run: >
            cargo audit
            --ignore RUSTSEC-2024-0436
            --ignore RUSTSEC-2025-0119
